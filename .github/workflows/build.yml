name: build

# Costruisce dal sorgente privato (segreto SOURCE_TOKEN) e pubblica solo i
# programmi pronti: QTHome per Mac (Apple e Intel) e Windows (più Mothership, solo per l'aggiornamento automatico).
# QTHome Mothership (strumento interno di IU1MVI) è nella release solo come file
# per l'aggiornamento automatico: non compare nelle note né sul sito. Ogni programma è un unico file nativo: finestra WebView del
# sistema + motore Go, senza Electron. Resta solo l'ultima release.
# Nei log non si stampa mai il sorgente.

on:
  workflow_dispatch:
    inputs:
      completa:
        description: 'Build completa anche se il sorgente non è cambiato'
        type: boolean
        default: false
      pubblica:
        description: 'Pubblica la release (se no: solo prove e artifact)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_REPO: SculptWorksLTD/QTHomeSource

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::notice::Manca il segreto SOURCE_TOKEN: nessuna build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}" refs/heads/main 2>/dev/null | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::SOURCE_TOKEN non riesce a leggere il sorgente (scaduto o senza permessi)."
            exit 1
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + "|" + .body' 2>/dev/null || true)
          tag="${last%%|*}"
          next=1
          case "$tag" in v0.1.*) next=$(( ${tag#v0.1.} + 1 ));; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$next" >> "$GITHUB_OUTPUT"
          mode=full
          if [ "${{ inputs.completa }}" != "true" ]; then
            pb=$(printf '%s' "$last" | grep -o 'build [0-9a-f]\{12\}' | head -1 | cut -d' ' -f2)
            [ "${sha:0:12}" = "$pb" ] && mode=none
          fi
          echo "Modo: $mode (sorgente ${sha:0:12}, ultima build: ${pb:-nessuna})"
          [ "$mode" = full ] && echo "build=true" >> "$GITHUB_OUTPUT" || echo "build=false" >> "$GITHUB_OUTPUT"

  mac:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Prepara (dipendenze e prove veloci)
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          set -o pipefail
          go test -short ./qtengine/ft8 ./qtengine/tuning ./qtengine/telemetry ./qtengine/oracle ./qtengine/audio ./qtengine/audioout ./qtengine/sqlite ./apps/... 2>&1 | tail -12
      - name: Compila (Apple e Intel, poi universale)
        run: |
          set -e
          flags="-s -w -X github.com/SculptWorksLTD/QTHome/qtengine.Version=${VERSION}"
          tflags="-s -w -X main.Version=${VERSION}"
          for a in arm64 amd64; do
            cf=""; [ $a = amd64 ] && cf="-arch x86_64"
            CGO_ENABLED=1 GOARCH=$a CGO_CFLAGS="$cf" CGO_LDFLAGS="$cf" go build -trimpath -ldflags "$flags" -o bin/$a/QTHome .
            CGO_ENABLED=1 GOARCH=$a CGO_CFLAGS="$cf" CGO_LDFLAGS="$cf" go build -trimpath -ldflags "$tflags" -o bin/$a/mothership ./apps/mothership
          done
          mkdir -p bin/u
          for p in QTHome mothership; do lipo -create -output bin/u/$p bin/arm64/$p bin/amd64/$p; done
          file bin/u/*
      - name: libusb universale (chiavetta SDR; LGPL-2.1, resta una libreria a parte)
        run: |
          set -e
          curl -sfL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 | tar xj
          cd libusb-1.0.27
          for a in arm64 x86_64; do
            make distclean >/dev/null 2>&1 || true
            h=x86_64-apple-darwin; [ $a = arm64 ] && h=aarch64-apple-darwin
            ./configure --disable-static --host=$h CFLAGS="-arch $a -mmacosx-version-min=11.0 -O2" LDFLAGS="-arch $a" >/dev/null
            make -j4 >/dev/null
            cp libusb/.libs/libusb-1.0.0.dylib ../libusb-$a.dylib
          done
          cd ..
          lipo -create -output bin/u/libusb-1.0.dylib libusb-arm64.dylib libusb-x86_64.dylib
          install_name_tool -id @rpath/libusb-1.0.dylib bin/u/libusb-1.0.dylib
          file bin/u/libusb-1.0.dylib
      - name: codec2 universale (FreeDV; LGPL-2.1, resta una libreria a parte)
        continue-on-error: true
        run: |
          set -e
          curl -sfL https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz | tar xz
          cmake -S codec2-1.2.0 -B c2 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DUNITTEST=OFF >/dev/null
          cmake --build c2 --target codec2 -j4 >/dev/null
          cp "$(find c2 -name 'libcodec2.*.dylib' -type f | head -1)" bin/u/libcodec2.dylib
          install_name_tool -id @rpath/libcodec2.dylib bin/u/libcodec2.dylib
          file bin/u/libcodec2.dylib
      - name: Icona
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          for n in mothership; do
            rm -rf $n.iconset; mkdir -p $n.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s build/resources/$n-1024.png --out $n.iconset/icon_${s}x${s}.png >/dev/null
              d=$((s*2)); sips -z $d $d build/resources/$n-1024.png --out $n.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns $n.iconset -o $n.icns
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: QTHome (.app Electron e installer)
        run: |
          set -e
          mkdir -p dist appA
          EV=$(npm view electron version); echo "Electron $EV"
          npx --yes @electron/packager@latest desktop QTHome --platform=darwin --arch=universal --electron-version="$EV" \
            --icon=icon.icns --app-bundle-id=com.sculptworks.qthome --app-version="$VERSION" --build-version="$VERSION" \
            --app-copyright="© 2026 SculptWorks LTD" --extend-info=desktop/extra.plist --asar --ignore='extra\.plist' --out=out --overwrite --quiet
          mv out/QTHome-darwin-universal/QTHome.app appA/
          APP="appA/QTHome.app"; C="$APP/Contents"
          cp bin/u/QTHome "$C/MacOS/qthome-motore"; chmod +x "$C/MacOS/qthome-motore"
          cp bin/u/libusb-1.0.dylib "$C/Frameworks/"
          if [ -f bin/u/libcodec2.dylib ]; then cp bin/u/libcodec2.dylib "$C/Frameworks/"; fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$C/Info.plist"
          codesign --force --deep --sign - "$APP"
          du -sh "$APP"
          pkgbuild --analyze --root appA comp.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" -c "Set :0:BundleOverwriteAction upgrade" comp.plist
          pkgbuild --root appA --component-plist comp.plist --install-location /Applications \
            --scripts build/pkg --identifier com.sculptworks.qthome --version "$VERSION" QTHome-core.pkg
          sed -e "s/__VERSION__/${VERSION}/" -e 's/hostArchitectures="arm64"/hostArchitectures="arm64,x86_64"/' build/pkg/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --resources build/pkg/resources "dist/QTHome-Mac.pkg"
      - name: QTHome Mothership (.app)
        run: |
          set -e
          mkapp() { # cartella, nome, eseguibile, id, extra plist
            local C="$1/$2.app/Contents"
            mkdir -p "$C/MacOS" "$C/Resources"
            cp "bin/u/$3" "$C/MacOS/$3"; chmod +x "$C/MacOS/$3"
            if [ "$3" = trainer ]; then mkdir -p "$C/Frameworks"; cp bin/u/libusb-1.0.dylib "$C/Frameworks/"; fi
            ic=icon.icns; [ -f "$3.icns" ] && ic="$3.icns"
            cp "$ic" "$C/Resources/icon.icns"
            cat > "$C/Info.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>$3</string>
          <key>CFBundleIconFile</key><string>icon</string>
          <key>CFBundleIdentifier</key><string>$4</string>
          <key>CFBundleName</key><string>$2</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSHumanReadableCopyright</key><string>© 2026 SculptWorks LTD · realizzato da IU1MVI</string>
          $5
          </dict></plist>
          PL
            sed -i '' -e 's/^          //' "$C/Info.plist"
            codesign --force --deep --sign - "$1/$2.app"
          }
          mkapp appM "QTHome Mothership" mothership com.sculptworks.qthome.mothership ""
          pkgbuild --analyze --root appM compM.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" compM.plist
          pkgbuild --root appM --component-plist compM.plist --install-location /Applications \
            --identifier com.sculptworks.qthome.mothership --version "$VERSION" mothership-core.pkg
          productbuild --package mothership-core.pkg "dist/QTHome-Mothership-Mac.pkg"
          ls -la dist
      - name: Prova di avvio (senza finestra)
        run: |
          set -e
          ( "appM/QTHome Mothership.app/Contents/MacOS/mothership" --senza-finestra & ) ; sleep 3
          curl -sf http://127.0.0.1:47460/api/state | head -c 300; echo
          pkill -f "MacOS/mothership" || true
      - name: Prova di avvio di QTHome (Electron + motore)
        continue-on-error: true
        run: |
          ( appA/QTHome.app/Contents/MacOS/QTHome --demo & ) ; sleep 15
          pgrep -fl qthome-motore || echo "motore non partito"
          curl -sf http://127.0.0.1:47481/qtui.js | head -c 120; echo
          screencapture -x shot-mac.png || true
          pkill -f "QTHome.app/Contents/MacOS/QTHome" || true; sleep 2; pgrep -fl qthome-motore && echo "motore ancora vivo" || echo "motore chiuso con la finestra"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: foto-mac, path: shot-mac.png, if-no-files-found: ignore, retention-days: 3 }
      - name: Programmi di WSJT-X per Q65/JT65/MSK144 (GPL v3, pacchetto a parte che QTHome scarica da solo)
        continue-on-error: true
        run: |
          set -e
          V=3.0.2
          curl -sfL -o COPYING-wsjtx https://raw.githubusercontent.com/WSJTX/wsjtx/v$V/COPYING
          for a in arm64 x86_64; do
            curl -sfL -o w-$a.pkg https://github.com/WSJTX/wsjtx/releases/download/v$V/wsjtx-$V-$a-macOS.pkg
            rm -rf wx-$a; pkgutil --expand-full w-$a.pkg wx-$a
            J=$(find wx-$a -type f -name jt9 -path '*/Contents/MacOS/*' | head -1)
            C=$(dirname "$(dirname "$J")")
            echo "jt9 in $J"
            go run ./tools/wsjtxpack -root "$C" -out dist/wsjtx-tools-mac-$a.zip -version $V -license COPYING-wsjtx MacOS/jt9 MacOS/q65code MacOS/jt65code MacOS/msk144code
          done
          # prova sul Mac della build (Apple): il pacchetto aperto altrove funziona da solo
          rm -rf wtest; mkdir wtest; (cd wtest && ditto -x -k ../dist/wsjtx-tools-mac-arm64.zip .)
          for f in Q65/60A_EME_6m/210106_1621.wav JT65/JT65B/000000_0004.wav MSK144/181211_120800.wav; do mkdir -p "samples/$(dirname $f)"; curl -sfL -o "samples/$f" "https://raw.githubusercontent.com/WSJTX/wsjtx/v$V/samples/$f"; done
          QTH_WSJTX_DIR="$PWD/wtest/wsjtx/MacOS" QTH_WSJTX_SAMPLES="$PWD/samples" go test -count=1 -v -run WithJT9 ./qtengine/wsjtxbin 2>&1 | tail -45
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  windows:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Prepara (dipendenze e icone)
        shell: bash
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          go install github.com/tc-hib/go-winres@latest
          W="$(go env GOPATH)/bin/go-winres"
          "$W" simply --icon build/resources/icon-256.png --product-name "QTHome" --file-description "QTHome - The Home of OM"
          (cd apps/mothership && "$W" simply --icon ../../build/resources/mothership-256.png --product-name "QTHome Mothership" --file-description "QTHome Mothership")
      - name: Prove (Windows)
        shell: bash
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -short ./qtengine/tuning ./qtengine/telemetry ./qtengine/audio ./qtengine/sqlite ./qtengine/winlink 2>&1 | tail -12
      - name: libusb per Windows (chiavetta SDR; LGPL-2.1, resta una libreria a parte accanto al programma)
        shell: bash
        run: |
          set -e
          curl -sfL -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x -olibusb libusb.7z >/dev/null
          cp libusb/MinGW64/dll/libusb-1.0.dll .
          ls -la libusb-1.0.dll
      - name: codec2 per Windows (FreeDV; LGPL-2.1, resta una libreria a parte accanto al programma)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -sfL https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz | tar xz
          cmake -S codec2-1.2.0 -B c2 -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DUNITTEST=OFF -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static" >/dev/null
          cmake --build c2 --target codec2 -j4 >/dev/null
          cp "$(find c2 -name 'libcodec2*.dll' | head -1)" libcodec2.dll
          ls -la libcodec2.dll
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compila (motore + finestra Electron)
        shell: bash
        run: |
          set -e
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -H=windowsgui -X github.com/SculptWorksLTD/QTHome/qtengine.Version=${VERSION}" -o qthome-motore.exe .
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=${VERSION}" -o "QTHome Mothership.exe" ./apps/mothership
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('build/resources/icon-256.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          EV=$(npm view electron version); echo "Electron $EV"
          npx --yes @electron/packager@latest desktop QTHome --platform=win32 --arch=x64 --electron-version="$EV" --icon=icon.ico \
            --app-version="$VERSION" --build-version="$VERSION" --app-copyright="© 2026 SculptWorks LTD" \
            --win32metadata.ProductName=QTHome --win32metadata.FileDescription="QTHome - The Home of OM" --win32metadata.CompanyName="SculptWorks LTD" \
            --asar --ignore='extra\.plist' --out=out --overwrite --quiet
          W=out/QTHome-win32-x64
          cp qthome-motore.exe libusb-1.0.dll "$W/"; [ -f libcodec2.dll ] && cp libcodec2.dll "$W/"
          mkdir -p dist z3
          (cd "$W" && 7z a -r ../../dist/QTHome-Windows.zip . >/dev/null)
          cp "QTHome Mothership.exe" z3/; (cd z3 && 7z a ../dist/QTHome-Mothership-Windows.zip "QTHome Mothership.exe" >/dev/null)
          # le versioni vecchie si aggiornano copiando l'ULTIMO .exe dello zip: deve essere il motore (che poi installa tutto)
          7z l -slt dist/QTHome-Windows.zip | grep -i '^Path = .*\.exe$'
          ls -la dist
      - name: Programmi di WSJT-X per Q65/JT65/MSK144 (GPL v3, pacchetto a parte che QTHome scarica da solo)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          V=3.0.2
          curl -sfL -o COPYING-wsjtx https://raw.githubusercontent.com/WSJTX/wsjtx/v$V/COPYING
          curl -sfL -o w.exe https://github.com/WSJTX/wsjtx/releases/download/v$V/wsjtx-$V-win64.exe
          7z x -owx w.exe >/dev/null
          J=$(find wx -iname jt9.exe | head -1); D=$(dirname "$J"); echo "jt9 in $J"
          find wx -iname '*.dll' | head -60
          go run ./tools/wsjtxpack -root "$D" -out dist/wsjtx-tools-windows.zip -version $V -license COPYING-wsjtx jt9.exe q65code.exe jt65code.exe msk144code.exe
          rm -rf wtest; mkdir wtest; (cd wtest && 7z x ../dist/wsjtx-tools-windows.zip >/dev/null)
          for f in Q65/60A_EME_6m/210106_1621.wav JT65/JT65B/000000_0004.wav MSK144/181211_120800.wav; do mkdir -p "samples/$(dirname $f)"; curl -sfL -o "samples/$f" "https://raw.githubusercontent.com/WSJTX/wsjtx/v$V/samples/$f"; done
          QTH_WSJTX_DIR="$(cygpath -w "$PWD/wtest/wsjtx")" QTH_WSJTX_SAMPLES="$PWD/samples" go test -count=1 -v -run WithJT9 ./qtengine/wsjtxbin 2>&1 | tail -45
          ls -la dist
      - name: Prova di avvio con la finestra vera
        continue-on-error: true
        shell: pwsh
        run: |
          $q = Start-Process -FilePath ".\out\QTHome-win32-x64\QTHome.exe" -ArgumentList "--demo" -PassThru
          $m = Start-Process -FilePath ".\QTHome Mothership.exe" -PassThru
          Start-Sleep 12
          foreach ($x in @(@($q,"http://127.0.0.1:47481/"), @($m,"http://127.0.0.1:47460/api/state"))) {
            $p = $x[0]; $u = $x[1]
            try { $r = Invoke-WebRequest -UseBasicParsing $u -TimeoutSec 5; $s = $r.StatusCode } catch { $s = "errore: " + $_.Exception.Message }
            "{0}: in esecuzione={1} · {2} → {3}" -f $p.ProcessName, (-not $p.HasExited), $u, $s
          }
          try { "FreeDV (codec2): " + (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:47481/api/freedv" -TimeoutSec 5).Content } catch { "FreeDV: " + $_.Exception.Message }
          Stop-Process $q, $m -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  preview:
    # controllo visivo: avvia le tre finestre su Linux e ne fa la foto (nel log)
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick
      - name: Compila
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          CGO_ENABLED=1 go build -o qthome . && CGO_ENABLED=1 go build -o mothership ./apps/mothership
      - name: Avvio e foto
        run: |
          set +e
          shot() { # nome, comando
            xvfb-run -a -s "-screen 0 1280x900x24" bash -c "$2 >app-$1.log 2>&1 & sleep 14; import -window root $1.png; echo import=\$?"
            pkill -9 -f "^\./$1"; sleep 1
            tail -n 4 app-$1.log
            if [ -f $1.png ]; then convert $1.png -resize 1000x -quality 75 foto-$1.jpg; base64 -w 6000 foto-$1.jpg | nl -nrz -w3 -s: | sed "s/^/SHOT-$1-/"; else echo "nessuna foto per $1"; fi
          }
          shot qthome "./qthome --demo"
          shot mothership "./mothership"
          true
      - uses: actions/upload-artifact@v4
        with:
          name: foto-finestre
          path: foto-*.jpg
          retention-days: 7

  catalina:
    # QTHome per Mac Catalina (macOS 10.15, solo Intel): Go 1.22 è l'ultimo che arriva a Catalina.
    # Si aggiorna solo da QTHome-Mac-Catalina.pkg. Se non riesce, la release esce lo stesso senza.
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GOTOOLCHAIN: local
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version: "1.22.x", cache: false }
      - name: Prepara per Go 1.22
        run: |
          sed -i '' -E 's/^go [0-9.]+$/go 1.22/; /^toolchain /d; /\/\/ indirect/d' go.mod
          cat go.mod
          go get github.com/webview/webview_go@latest
          go mod tidy
          go version
      - name: Prove con Go 1.22
        run: |
          set -o pipefail
          # Go 1.22 col linker interno non scrive LC_UUID e il dyld dei Mac nuovi rifiuta il binario: linker esterno
          go test -short -ldflags=-linkmode=external ./qtengine/tuning ./qtengine/telemetry ./qtengine/sqlite ./qtengine/ft8 2>&1 | tail -12
      - name: Compila (Intel, macOS 10.15)
        run: |
          set -e
          f="-arch x86_64 -mmacosx-version-min=10.15"
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="$f" CGO_LDFLAGS="$f" go build -trimpath \
            -ldflags "-s -w -X github.com/SculptWorksLTD/QTHome/qtengine.Version=${VERSION} -X main.macAsset=QTHome-Mac-Catalina.pkg" -o QTHome .
          file QTHome
          otool -l QTHome | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -2
      - name: libusb e codec2 (Intel, macOS 10.15)
        continue-on-error: true
        run: |
          set -e
          curl -sfL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 | tar xj
          (cd libusb-1.0.27 && ./configure --disable-static --host=x86_64-apple-darwin CFLAGS="-arch x86_64 -mmacosx-version-min=10.15 -O2" LDFLAGS="-arch x86_64" >/dev/null && make -j4 >/dev/null)
          cp libusb-1.0.27/libusb/.libs/libusb-1.0.0.dylib libusb-1.0.dylib
          install_name_tool -id @rpath/libusb-1.0.dylib libusb-1.0.dylib
          curl -sfL https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz | tar xz
          cmake -S codec2-1.2.0 -B c2 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DUNITTEST=OFF >/dev/null
          cmake --build c2 --target codec2 -j4 >/dev/null
          cp "$(find c2 -name 'libcodec2.*.dylib' -type f | head -1)" libcodec2.dylib
          install_name_tool -id @rpath/libcodec2.dylib libcodec2.dylib
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pacchetto
        run: |
          set -e
          mkdir -p icon.iconset dist
          for s in 16 32 128 256 512; do
            sips -z $s $s build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          # Electron 32: l'ultimo che gira su macOS 10.15
          mkdir -p appC
          EV=$(npm view 'electron@32' version | tail -1 | sed -E "s/.*'([0-9.]+)'.*/\1/"); echo "Electron $EV"
          npx --yes @electron/packager@latest desktop QTHome --platform=darwin --arch=x64 --electron-version="$EV" \
            --icon=icon.icns --app-bundle-id=com.sculptworks.qthome --app-version="$VERSION" --build-version="$VERSION" \
            --app-copyright="© 2026 SculptWorks LTD" --extend-info=desktop/extra.plist --asar --ignore='extra\.plist' --out=out --overwrite --quiet
          mv out/QTHome-darwin-x64/QTHome.app appC/
          APP="appC/QTHome.app"; C="$APP/Contents"
          cp QTHome "$C/MacOS/qthome-motore"; chmod +x "$C/MacOS/qthome-motore"
          for l in libusb-1.0.dylib libcodec2.dylib; do [ -f "$l" ] && cp "$l" "$C/Frameworks/"; done
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$C/Info.plist" || true
          codesign --force --deep --sign - "$APP"
          pkgbuild --analyze --root appC comp.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" -c "Set :0:BundleOverwriteAction upgrade" comp.plist
          pkgbuild --root appC --component-plist comp.plist --install-location /Applications \
            --scripts build/pkg --identifier com.sculptworks.qthome --version "$VERSION" QTHome-core.pkg
          sed -e "s/__VERSION__/${VERSION}/" -e 's/hostArchitectures="arm64"/hostArchitectures="x86_64"/' build/pkg/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --resources build/pkg/resources "dist/QTHome-Mac-Catalina.pkg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-catalina
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, mac, windows, catalina]
    if: ${{ !cancelled() && inputs.pubblica && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -la dist
          D="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          {
            echo "## Scarica · Download"
            echo
            echo "| | Mac (Apple e Intel, macOS 11+) | Windows 10 / 11 |"
            echo "|---|---|---|"
            echo "| **QTHome** | [⬇ QTHome-Mac.pkg](${D}/QTHome-Mac.pkg) | [⬇ QTHome-Windows.zip](${D}/QTHome-Windows.zip) |"
            echo
            [ -f dist/QTHome-Mac-Catalina.pkg ] && { echo "Mac con macOS 10.15 Catalina (Intel): [⬇ QTHome-Mac-Catalina.pkg](${D}/QTHome-Mac-Catalina.pkg)"; echo; }
            echo "Mac: doppio clic sul .pkg (se il Mac lo blocca: tasto destro → Apri). Windows: apri lo zip e avvia il programma (se Windows avvisa: Ulteriori informazioni → Esegui comunque)."
            echo
            echo "FT8 e FT4 decodificati con il motore di WSJT-X, scaricato da solo la prima volta. Problemi e idee: tasto Segnala in QTHome."
            echo
            echo "Versione di prova. Realizzato da IU1MVI. (build ${SHA:0:12})"
          } > notes.md
          gh release create "v${VERSION}" dist/* --repo "${{ github.repository }}" --title "QTHome ${VERSION}" --notes-file notes.md --latest
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" != "v${VERSION}" ] && gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
