name: build

# Costruisce dal sorgente privato (segreto SOURCE_TOKEN) e pubblica solo i
# programmi pronti: QTHome e QTHome Trainer per Mac (Apple e Intel) e Windows.
# QTHome Mothership (strumento interno di IU1MVI) è nella release solo come file
# per l'aggiornamento automatico: non compare nelle note né sul sito. Ogni programma è un unico file nativo: finestra WebView del
# sistema + motore Go, senza Electron. Resta solo l'ultima release.
# Nei log non si stampa mai il sorgente.

on:
  workflow_dispatch:
    inputs:
      completa:
        description: 'Build completa anche se il sorgente non è cambiato'
        type: boolean
        default: false
      pubblica:
        description: 'Pubblica la release (se no: solo prove e artifact)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_REPO: SculptWorksLTD/QTHomeSource

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::notice::Manca il segreto SOURCE_TOKEN: nessuna build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}" refs/heads/main 2>/dev/null | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::SOURCE_TOKEN non riesce a leggere il sorgente (scaduto o senza permessi)."
            exit 1
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + "|" + .body' 2>/dev/null || true)
          tag="${last%%|*}"
          next=1
          case "$tag" in v0.1.*) next=$(( ${tag#v0.1.} + 1 ));; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$next" >> "$GITHUB_OUTPUT"
          mode=full
          if [ "${{ inputs.completa }}" != "true" ]; then
            pb=$(printf '%s' "$last" | grep -o 'build [0-9a-f]\{12\}' | head -1 | cut -d' ' -f2)
            [ "${sha:0:12}" = "$pb" ] && mode=none
          fi
          echo "Modo: $mode (sorgente ${sha:0:12}, ultima build: ${pb:-nessuna})"
          [ "$mode" = full ] && echo "build=true" >> "$GITHUB_OUTPUT" || echo "build=false" >> "$GITHUB_OUTPUT"

  mac:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Prepara (dipendenze e prove veloci)
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          go test ./qtengine/ft8 ./qtengine/telemetry ./qtengine/oracle ./qtengine/audio ./apps/... 2>&1 | tail -8
      - name: Compila (Apple e Intel, poi universale)
        run: |
          set -e
          flags="-s -w -X github.com/SculptWorksLTD/QTHome/qtengine.Version=${VERSION}"
          tflags="-s -w -X main.Version=${VERSION}"
          for a in arm64 amd64; do
            cf=""; [ $a = amd64 ] && cf="-arch x86_64"
            CGO_ENABLED=1 GOARCH=$a CGO_CFLAGS="$cf" CGO_LDFLAGS="$cf" go build -trimpath -ldflags "$flags" -o bin/$a/QTHome .
            CGO_ENABLED=1 GOARCH=$a CGO_CFLAGS="$cf" CGO_LDFLAGS="$cf" go build -trimpath -ldflags "$tflags" -o bin/$a/trainer ./apps/trainer
            CGO_ENABLED=1 GOARCH=$a CGO_CFLAGS="$cf" CGO_LDFLAGS="$cf" go build -trimpath -ldflags "$tflags" -o bin/$a/mothership ./apps/mothership
          done
          mkdir -p bin/u
          for p in QTHome trainer mothership; do lipo -create -output bin/u/$p bin/arm64/$p bin/amd64/$p; done
          file bin/u/*
      - name: libusb universale (chiavetta SDR; LGPL-2.1, resta una libreria a parte)
        run: |
          set -e
          curl -sfL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 | tar xj
          cd libusb-1.0.27
          for a in arm64 x86_64; do
            make distclean >/dev/null 2>&1 || true
            h=x86_64-apple-darwin; [ $a = arm64 ] && h=aarch64-apple-darwin
            ./configure --disable-static --host=$h CFLAGS="-arch $a -mmacosx-version-min=11.0 -O2" LDFLAGS="-arch $a" >/dev/null
            make -j4 >/dev/null
            cp libusb/.libs/libusb-1.0.0.dylib ../libusb-$a.dylib
          done
          cd ..
          lipo -create -output bin/u/libusb-1.0.dylib libusb-arm64.dylib libusb-x86_64.dylib
          install_name_tool -id @rpath/libusb-1.0.dylib bin/u/libusb-1.0.dylib
          file bin/u/libusb-1.0.dylib
      - name: codec2 universale (FreeDV; LGPL-2.1, resta una libreria a parte)
        continue-on-error: true
        run: |
          set -e
          curl -sfL https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz | tar xz
          cmake -S codec2-1.2.0 -B c2 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DUNITTEST=OFF >/dev/null
          cmake --build c2 --target codec2 -j4 >/dev/null
          cp "$(find c2 -name 'libcodec2.*.dylib' -type f | head -1)" bin/u/libcodec2.dylib
          install_name_tool -id @rpath/libcodec2.dylib bin/u/libcodec2.dylib
          file bin/u/libcodec2.dylib
      - name: Icona
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/resources/icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          for n in trainer mothership; do
            rm -rf $n.iconset; mkdir -p $n.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s build/resources/$n-1024.png --out $n.iconset/icon_${s}x${s}.png >/dev/null
              d=$((s*2)); sips -z $d $d build/resources/$n-1024.png --out $n.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns $n.iconset -o $n.icns
          done
      - name: QTHome (.app e installer)
        run: |
          set -e
          mkdir -p dist
          APP="appA/QTHome.app"; C="$APP/Contents"
          mkdir -p "$C/MacOS" "$C/Resources"
          cp bin/u/QTHome "$C/MacOS/QTHome"; chmod +x "$C/MacOS/QTHome"
          mkdir -p "$C/Frameworks"; cp bin/u/libusb-1.0.dylib "$C/Frameworks/"
          if [ -f bin/u/libcodec2.dylib ]; then cp bin/u/libcodec2.dylib "$C/Frameworks/"; fi
          cp icon.icns "$C/Resources/icon.icns"
          sed -e "s|<string>0.1.0</string>|<string>${VERSION}</string>|g" build/pkg/Info.plist > "$C/Info.plist"
          codesign --force --deep --sign - "$APP"
          pkgbuild --analyze --root appA comp.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" -c "Set :0:BundleOverwriteAction upgrade" comp.plist
          pkgbuild --root appA --component-plist comp.plist --install-location /Applications \
            --scripts build/pkg --identifier com.sculptworks.qthome --version "$VERSION" QTHome-core.pkg
          sed -e "s/__VERSION__/${VERSION}/" -e 's/hostArchitectures="arm64"/hostArchitectures="arm64,x86_64"/' build/pkg/distribution.xml > distribution.xml
          productbuild --distribution distribution.xml --resources build/pkg/resources "dist/QTHome-Mac.pkg"
      - name: QTHome Trainer e Mothership (.app)
        run: |
          set -e
          mkapp() { # cartella, nome, eseguibile, id, extra plist
            local C="$1/$2.app/Contents"
            mkdir -p "$C/MacOS" "$C/Resources"
            cp "bin/u/$3" "$C/MacOS/$3"; chmod +x "$C/MacOS/$3"
            if [ "$3" = trainer ]; then mkdir -p "$C/Frameworks"; cp bin/u/libusb-1.0.dylib "$C/Frameworks/"; fi
            ic=icon.icns; [ -f "$3.icns" ] && ic="$3.icns"
            cp "$ic" "$C/Resources/icon.icns"
            cat > "$C/Info.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>$3</string>
          <key>CFBundleIconFile</key><string>icon</string>
          <key>CFBundleIdentifier</key><string>$4</string>
          <key>CFBundleName</key><string>$2</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSHumanReadableCopyright</key><string>© 2026 SculptWorks LTD · realizzato da IU1MVI</string>
          $5
          </dict></plist>
          PL
            sed -i '' -e 's/^          //' "$C/Info.plist"
            codesign --force --deep --sign - "$1/$2.app"
          }
          mic='<key>NSMicrophoneUsageDescription</key><string>QTHome Trainer ascolta l’audio della radio (FT8, FT4, CW) per confrontare i decoder. Listens to the radio audio (FT8, FT4, CW) to compare decoders.</string>'
          mkapp appT "QTHome Trainer" trainer com.sculptworks.qthome.trainer "$mic"
          pkgbuild --analyze --root appT compT.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" compT.plist
          pkgbuild --root appT --component-plist compT.plist --install-location /Applications \
            --identifier com.sculptworks.qthome.trainer --version "$VERSION" trainer-core.pkg
          productbuild --package trainer-core.pkg "dist/QTHome-Trainer-Mac.pkg"
          mkapp appM "QTHome Mothership" mothership com.sculptworks.qthome.mothership ""
          pkgbuild --analyze --root appM compM.plist
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" compM.plist
          pkgbuild --root appM --component-plist compM.plist --install-location /Applications \
            --identifier com.sculptworks.qthome.mothership --version "$VERSION" mothership-core.pkg
          productbuild --package mothership-core.pkg "dist/QTHome-Mothership-Mac.pkg"
          ls -la dist
      - name: Prova di avvio (senza finestra)
        run: |
          set -e
          ( "appT/QTHome Trainer.app/Contents/MacOS/trainer" --senza-finestra --porta 47470 & ) ; sleep 4
          curl -sf http://127.0.0.1:47470/api/trainer/state | head -c 300; echo
          ( "appM/QTHome Mothership.app/Contents/MacOS/mothership" --senza-finestra & ) ; sleep 3
          curl -sf http://127.0.0.1:47460/api/state | head -c 300; echo
          pkill -f "MacOS/trainer" || true; pkill -f "MacOS/mothership" || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  windows:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Prepara (dipendenze e icone)
        shell: bash
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          go install github.com/tc-hib/go-winres@latest
          W="$(go env GOPATH)/bin/go-winres"
          "$W" simply --icon build/resources/icon-256.png --product-name "QTHome" --file-description "QTHome - The Home of OM"
          (cd apps/trainer && "$W" simply --icon ../../build/resources/trainer-256.png --product-name "QTHome Trainer" --file-description "QTHome Trainer")
          (cd apps/mothership && "$W" simply --icon ../../build/resources/mothership-256.png --product-name "QTHome Mothership" --file-description "QTHome Mothership")
      - name: libusb per Windows (chiavetta SDR; LGPL-2.1, resta una libreria a parte accanto al programma)
        shell: bash
        run: |
          set -e
          curl -sfL -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x -olibusb libusb.7z >/dev/null
          cp libusb/MinGW64/dll/libusb-1.0.dll .
          ls -la libusb-1.0.dll
      - name: codec2 per Windows (FreeDV; LGPL-2.1, resta una libreria a parte accanto al programma)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -sfL https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz | tar xz
          cmake -S codec2-1.2.0 -B c2 -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DUNITTEST=OFF -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static" >/dev/null
          cmake --build c2 --target codec2 -j4 >/dev/null
          cp "$(find c2 -name 'libcodec2*.dll' | head -1)" libcodec2.dll
          ls -la libcodec2.dll
      - name: Compila
        shell: bash
        run: |
          set -e
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -H=windowsgui -X github.com/SculptWorksLTD/QTHome/qtengine.Version=${VERSION}" -o QTHome.exe .
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=${VERSION}" -o "QTHome Trainer.exe" ./apps/trainer
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=${VERSION}" -o "QTHome Mothership.exe" ./apps/mothership
          mkdir -p dist internal z1 z2 z3
          C2=""; [ -f libcodec2.dll ] && C2=libcodec2.dll
          cp QTHome.exe libusb-1.0.dll $C2 z1/; cp "QTHome Trainer.exe" libusb-1.0.dll z2/; cp "QTHome Mothership.exe" z3/
          (cd z1 && 7z a ../dist/QTHome-Windows.zip QTHome.exe libusb-1.0.dll $C2 >/dev/null)
          (cd z2 && 7z a ../dist/QTHome-Trainer-Windows.zip "QTHome Trainer.exe" libusb-1.0.dll >/dev/null)
          (cd z3 && 7z a ../dist/QTHome-Mothership-Windows.zip "QTHome Mothership.exe" >/dev/null)
          ls -la dist
      - name: Prova di avvio con la finestra vera
        continue-on-error: true
        shell: pwsh
        run: |
          $q = Start-Process -FilePath ".\QTHome.exe" -ArgumentList "--demo" -PassThru
          $t = Start-Process -FilePath ".\QTHome Trainer.exe" -PassThru
          $m = Start-Process -FilePath ".\QTHome Mothership.exe" -PassThru
          Start-Sleep 12
          foreach ($x in @(@($q,"http://127.0.0.1:47481/"), @($t,"http://127.0.0.1:47470/api/trainer/state"), @($m,"http://127.0.0.1:47460/api/state"))) {
            $p = $x[0]; $u = $x[1]
            try { $r = Invoke-WebRequest -UseBasicParsing $u -TimeoutSec 5; $s = $r.StatusCode } catch { $s = "errore: " + $_.Exception.Message }
            "{0}: in esecuzione={1} · {2} → {3}" -f $p.ProcessName, (-not $p.HasExited), $u, $s
          }
          try { "FreeDV (codec2): " + (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:47481/api/freedv" -TimeoutSec 5).Content } catch { "FreeDV: " + $_.Exception.Message }
          Stop-Process $q, $t, $m -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  preview:
    # controllo visivo: avvia le tre finestre su Linux e ne fa la foto (nel log)
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: false }
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick
      - name: Compila
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          CGO_ENABLED=1 go build -o qthome . && CGO_ENABLED=1 go build -o trainer ./apps/trainer && CGO_ENABLED=1 go build -o mothership ./apps/mothership
      - name: Avvio e foto
        run: |
          set +e
          shot() { # nome, comando
            xvfb-run -a -s "-screen 0 1280x900x24" bash -c "$2 >app-$1.log 2>&1 & sleep 14; import -window root $1.png; echo import=\$?"
            pkill -9 -f "^\./$1"; sleep 1
            tail -n 4 app-$1.log
            if [ -f $1.png ]; then convert $1.png -resize 1000x -quality 75 foto-$1.jpg; base64 -w 6000 foto-$1.jpg | nl -nrz -w3 -s: | sed "s/^/SHOT-$1-/"; else echo "nessuna foto per $1"; fi
          }
          shot qthome "./qthome --demo"
          shot trainer "./trainer"
          shot mothership "./mothership"
          true
      - uses: actions/upload-artifact@v4
        with:
          name: foto-finestre
          path: foto-*.jpg
          retention-days: 7

  release:
    needs: [check, mac, windows]
    if: ${{ inputs.pubblica }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -la dist
          D="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          {
            echo "## Scarica · Download"
            echo
            echo "| | Mac (Apple e Intel) | Windows 10 / 11 |"
            echo "|---|---|---|"
            echo "| **QTHome** | [⬇ QTHome-Mac.pkg](${D}/QTHome-Mac.pkg) | [⬇ QTHome-Windows.zip](${D}/QTHome-Windows.zip) |"
            echo "| **QTHome Trainer** (beta tester) | [⬇ QTHome-Trainer-Mac.pkg](${D}/QTHome-Trainer-Mac.pkg) | [⬇ QTHome-Trainer-Windows.zip](${D}/QTHome-Trainer-Windows.zip) |"
            echo
            echo "Mac: doppio clic sul .pkg (se il Mac lo blocca: tasto destro → Apri). Windows: apri lo zip e avvia il programma (se Windows avvisa: Ulteriori informazioni → Esegui comunque)."
            echo
            echo "**QTHome Trainer** ascolta insieme a te (solo ricezione) e confronta il decoder FT8/FT4 di QTHome con WSJT-X. Serve WSJT-X installato. Manda solo dati anonimi, e gli spezzoni audio solo se acconsenti."
            echo
            echo "Versione di prova. Realizzato da IU1MVI. (build ${SHA:0:12})"
          } > notes.md
          gh release create "v${VERSION}" dist/* --repo "${{ github.repository }}" --title "QTHome ${VERSION}" --notes-file notes.md --latest
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" != "v${VERSION}" ] && gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
